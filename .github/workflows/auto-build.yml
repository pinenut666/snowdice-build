name: Auto Build
on:
  push:
    branches:
      - dev
  workflow_dispatch:

env:
  ANDROID_NDK_VERSION: r25c
  COMMIT_ID: "${{ github.sha }}"
  NO_BUILD_PROMPT: "no new commits, no need to build."
  NT_SIGN_URL: ${{ secrets.NT_SIGN_URL }}

jobs:
  commit-num-check:
    name: Check Commit Num
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Get New Commits
        id: get-commits
        run: echo "NEW_COMMIT_COUNT=$(git log --oneline --since '24 hours ago' | wc -l)" >> $GITHUB_OUTPUT

      - name: Get Commit IDs
        id: get-commit-ids
        run: |
          echo "UI_CID=$(cd sealdice-ui && git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "CORE_CID=$(cd sealdice-core && git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Warning
        run: if [ "$(git log --oneline --since '24 hours ago' | wc -l)" -le 0 ]; then echo "$NO_BUILD_PROMPT"; fi

    outputs:
      commit-count: ${{ steps.get-commits.outputs.NEW_COMMIT_COUNT }}
      CORE_CID: ${{ steps.get-commit-ids.outputs.CORE_CID }}
      UI_CID: ${{ steps.get-commit-ids.outputs.UI_CID }}

  ui-build:
    name: Build UI
    runs-on: ubuntu-latest
    needs: commit-num-check
    if: ${{ needs.commit-num-check.outputs.commit-count > 0 }}
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get Commit ID
        run: |
          cd sealdice-ui
          echo "UI_CID=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Cache UI dist
        id: cache-ui-dist
        uses: actions/cache@v4
        env:
          cache-name: cache-ui-dist
        with:
          path: ./sealdice-ui/dist
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ env.UI_CID }}

      - name: Show cache
        if: ${{ steps.cache-ui-dist.outputs.cache-hit == 'true' }}
        continue-on-error: true
        run: ls ./sealdice-ui/dist

      - name: Install Pnpm
        uses: pnpm/action-setup@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          version: 10
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        with:
          node-version: 20

      - name: Install Dependencies
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm install

      - name: Build WebUI
        if: ${{ steps.cache-ui-dist.outputs.cache-hit != 'true' }}
        working-directory: ./sealdice-ui
        run: pnpm run build-only

      - name: Upload UI
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-ui/dist

  core-build:
    name: Build Core
    runs-on: ubuntu-latest
    needs: ui-build
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: ['386', amd64, arm64]
        exclude:
          - goos: linux
            goarch: '386'
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: '386'
      fail-fast: true
    steps:
      - name: Apt-get Update
        run: sudo apt-get update

      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Cross-compiler for Windows
        if: matrix.goos == 'windows'
        run: sudo apt-get -y install mingw-w64

      - name: Install Cross-compiler for Linux Amd64 Musl
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: sudo apt-get -y install musl-tools

      - name: Install Cross-compiler for Linux Arm64 Musl
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          wget https://github.com/sealdice/tooolchain/releases/download/1/aarch64-linux-musl-cross.tgz
          tar zxf aarch64-linux-musl-cross.tgz

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache-dependency-path: sealdice-core/go.sum

      - name: Revert Golang1.25 commit for Windows7/8
        if: ${{ matrix.goos == 'windows' }}
        run: |
          cd "$(go env GOROOT)"
          patch --verbose -p 1 < "$GITHUB_WORKSPACE/.github/patch_go/unified-1-25-patch.diff"

      - name: Install Dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .

      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        working-directory: ./sealdice-core
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV
          if [ "$GOOS" = 'windows' ]; then
            echo "BINARY_NAME=sealdice-core.exe" >> $GITHUB_ENV
          else
            echo "BINARY_NAME=sealdice-core" >> $GITHUB_ENV
          fi
          if [ "$GOOS" = 'windows' ] && [ "$GOARCH" = '386' ]; then
            echo "CC=i686-w64-mingw32-gcc" >> $GITHUB_ENV
          elif [ "$GOOS" = 'windows' ] && [ "$GOARCH" = 'amd64' ]; then
            echo "CC=x86_64-w64-mingw32-gcc" >> $GITHUB_ENV
          elif [ "$GOOS" = 'linux' ] && [ "$GOARCH" = 'amd64' ]; then
            echo "CC=musl-gcc" >> $GITHUB_ENV
          elif [ "$GOOS" = 'linux' ] && [ "$GOARCH" = 'arm64' ]; then
            echo "CC=$(readlink -f ../aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc)" >> $GITHUB_ENV
          fi

      - name: Build Binary
        if: matrix.goos != 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: ${{ matrix.goos == 'windows' && 1 || 0 }}
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2 -H=windowsgui
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: go build -o "output/$BINARY_NAME" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_PRERELEASE=-dev -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} -X sealdice-core/dice.APP_CHANNEL=dev -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Build Binary (linux musl)
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: 1
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2 -H=windowsgui
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: go build -tags musl -o "output/$BINARY_NAME" -trimpath -ldflags "-s -w -linkmode external -extldflags '-static' -X sealdice-core/dice.VERSION_PRERELEASE=-dev -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} -X sealdice-core/dice.APP_CHANNEL=dev -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Run UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: ./sealdice-core/output/${{ env.BINARY_NAME }}
          args: -9 -fq

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./sealdice-core/output

  core-darwin-build:
    name: Build Core (darwin)
    runs-on: macos-latest
    needs: ui-build
    strategy:
      matrix:
        goos: [darwin]
        goarch: [amd64, arm64]
      fail-fast: true
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sealdice-core/go.sum

      - name: Install dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .

      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        working-directory: ./sealdice-core
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GO111MODULE: on
          CGO_ENABLED: 1
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2 -mmacosx-version-min=10.12
          CGO_CFLAGS: -mmacosx-version-min=10.12
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: go build -o "output/sealdice-core" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_PRERELEASE=-dev -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} -X sealdice-core/dice.APP_CHANNEL=dev -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./sealdice-core/output

  core-android-build:
    name: Build Core (android, arm64)
    runs-on: ubuntu-latest
    needs: ui-build
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          link-to-sdk: true
          local-cache: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: sealdice-core/go.sum

      - name: Install dependencies
        working-directory: ./sealdice-core
        run: |
          go mod tidy
          go get .

      - name: Get UI Resources
        uses: actions/download-artifact@v4
        with:
          name: sealdice-ui
          path: ./sealdice-core/static/frontend

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        working-directory: ./sealdice-core
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: Build binary
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang
          CGO_FLAGS: -Werror=unused-variable -Werror=implicit-function-declaration -O2
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
          SEAL_TRUSTED_PRIVATE_KEY: ${{ secrets.SEAL_TRUSTED_PRIVATE_KEY }}
          SEAL_SIGN_PRIVATE_KEY: ${{ secrets.SEAL_SIGN_PRIVATE_KEY }}
          SEAL_SIGN_V3_URL: ${{ secrets.SEAL_SIGN_V3_URL }}
        working-directory: ./sealdice-core
        run: go build -o "output/sealdice-core" -trimpath -ldflags "-s -w -X sealdice-core/dice.VERSION_PRERELEASE=-dev -X sealdice-core/dice.VERSION_BUILD_METADATA=+${CUR_TIME}.${COMMIT_ID::7} -X sealdice-core/dice.APP_CHANNEL=dev -X 'sealdice-core/dice.DefaultSignUrl=${NT_SIGN_URL}' -X 'sealdice-core/dice.SealTrustedClientPrivateKey=${SEAL_TRUSTED_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignClientPrivateKey=${SEAL_SIGN_PRIVATE_KEY}' -X 'sealdice-core/dice.SealSignV3Url=${SEAL_SIGN_V3_URL}'" .

      - name: Upload Core
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_android_arm64
          path: ./sealdice-core/output

  pc-pack:
    name: PC Pack
    runs-on: ubuntu-latest
    needs:
      - core-build
      - core-darwin-build
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: ['386', amd64, arm64]
        exclude:
          - goos: linux
            goarch: '386'
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: '386'
          - goos: darwin
            goarch: '386'
    steps:
      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: Get Core
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: .

      - name: Set Execute Attribute
        if: matrix.goos != 'windows'
        run: chmod +x ./sealdice-core

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: .

  preparation:
    name: Compressed Files Preparation
    runs-on: ubuntu-latest
    needs:
      - pc-pack
      - commit-num-check
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: ['386', amd64, arm64]
        exclude:
          - goos: linux
            goarch: '386'
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: '386'
          - goos: darwin
            goarch: '386'
    steps:
      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: Get Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ./temp/

      - name: Compress (default)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd ./temp
          find . -type f | cut -c 3- | tar -zcvf "../sealdice_${PROJECT_VERSION_C}_${GOOS}_${GOARCH}.tar.gz" -T -
          echo "DIST=sealdice_${PROJECT_VERSION_C}_${GOOS}_${GOARCH}.tar.gz" >> $GITHUB_ENV

      - name: Compress (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd ./temp
          zip -r "../sealdice_${PROJECT_VERSION_C}_${GOOS}_${GOARCH}.zip" .
          echo "DIST=sealdice_${PROJECT_VERSION_C}_${GOOS}_${GOARCH}.zip" >> $GITHUB_ENV

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sealdice-prerelease_${{ env.PROJECT_VERSION_C }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.DIST }}

  prerelease:
    name: Prerelease
    runs-on: ubuntu-latest
    needs:
      - preparation
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Files
        uses: actions/download-artifact@v4
        with:
          pattern: sealdice-prerelease*
          path: ./dist/
          merge-multiple: true

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Update Prerelease tag
        run: |
          git tag -f pre-release
          git push -f origin pre-release

      - name: Update Prerelease
        uses: ncipollo/release-action@v1
        with:
          tag: pre-release
          name: 'Latest Dev Build ${{ steps.currentTime.outputs.time }}'
          prerelease: true
          body: '> ⚠️注意️️：这是自动构建的预发布版本，非正式版本！'
          artifacts: |
            dist/sealdice*
          allowUpdates: true
          removeArtifacts: true

  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs:
      - core-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Get current time
        uses: Kaven-Universe/github-action-current-date-time@v1
        id: currentTime
        with:
          format: YYYYMMDD
          timezone-offset: -480

      - name: Set Env
        env:
          CUR_TIME: ${{ steps.currentTime.outputs.time }}
        run: |
          echo "PROJECT_VERSION_C=${CUR_TIME}-${COMMIT_ID::7}" >> $GITHUB_ENV

      - name: Get Amd64 Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_linux_amd64
          path: ./amd64/

      - name: Get Arm64 Files
        uses: actions/download-artifact@v4
        with:
          name: sealdice-core_${{ env.PROJECT_VERSION_C }}_linux_arm64
          path: ./arm64/

      - name: Chmod
        run: |
          chmod +x ./amd64/sealdice-core
          chmod +x ./arm64/sealdice-core

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/sealdice
          tags: |
            type=edge
            type=raw,value={{date 'YYYYMMDD' tz='Asia/Shanghai'}}-{{sha}},event=branch
            type=ref,event=tag

      - name: Docker Build
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./scripts/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            AUTHOR=${{ github.repository_owner }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  clear-temp-artifact:
    name: Clear Temp Artifacts
    if: always()
    runs-on: ubuntu-latest
    needs:
      - prerelease
      - docker-push
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@v4
        with:
          token: ${{ github.token }}
          name: |
            sealdice-ui
            sealdice-core*
            sealdice-prerelease*
